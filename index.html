<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Classyk">
    <title>Classyk</title>
    <link rel="icon" type="image/png" sizes="32x32" href="TemplateData/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1" aria-label="Classyk"></canvas>
      <div id="unity-loading-bar" role="status" aria-live="polite">
        <div id="unity-loading-content">
          <img id="app-logo" src="TemplateData/app-logo.png" alt="Classyk">
          <div id="unity-progress-bar-empty" aria-hidden="true">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div id="unity-loading-status">
            <span>Loading</span>
            <span id="unity-loading-percentage">0%</span>
          </div>
        </div>
      </div>
      <div id="unity-warning" aria-live="assertive"></div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingPercentage = document.querySelector("#unity-loading-percentage");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "grid" : "none";
        }

        var banner = document.createElement("div");
        banner.className = "unity-message unity-message--" + (type || "info");
        banner.textContent = message;
        warningBanner.appendChild(banner);

        if (type !== "error") {
          setTimeout(function () {
            banner.remove();
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Release.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Release.data.unityweb",
        frameworkUrl: buildUrl + "/Release.framework.js.unityweb",
        codeUrl: buildUrl + "/Release.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "FirstClass",
        productName: "Classyk",
        productVersion: "0.0.38",
        showBanner: unityShowBanner
      };


      loadingBar.style.display = "grid";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percentage = Math.round(progress * 100);
          progressBarFull.style.width = percentage + "%";
          loadingPercentage.textContent = percentage + "%";
        }).then(function (unityInstance) {
          loadingBar.classList.add("is-hidden");
          setTimeout(function () {
            loadingBar.style.display = "none";
          }, 320);
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      script.onerror = function () {
        unityShowBanner("The application could not be loaded. Please check your connection and try again.", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
